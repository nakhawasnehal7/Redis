server.port=8085

spring.application.name=redis-session-demo

# --- Source of truth database: your existing "shopping" Postgres instance ---
spring.datasource.url=jdbc:postgresql://localhost:5433/shopping
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=shopping_user
spring.datasource.password=${DB_PASSWORD:shopping_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- AWS ElastiCache for Redis ---
# Primary endpoint of your ElastiCache replication group, e.g.:
# my-cache.abcdef.ng.0001.use1.cache.amazonaws.com  (cluster mode disabled - primary endpoint)
# my-cache.abcdef.clustercfg.use1.cache.amazonaws.com (cluster mode enabled - configuration endpoint)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ElastiCache "encryption in transit" -> requires TLS
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# AUTH token if Redis AUTH / IAM auth is enabled on the cluster
spring.data.redis.password=${REDIS_PASSWORD:}

spring.data.redis.timeout=2000ms

spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms

# Set spring.data.redis.cluster.nodes instead of host/port when ElastiCache
# "Cluster Mode Enabled" is on.
spring.data.redis.lettuce.shutdown-timeout=200ms

# --- Custom app cache settings ---
app.cache.user-profile-ttl-seconds=600
app.session.ttl-seconds=1800

# --- Rate limiting ---
# Brute-force protection on /api/auth/login, keyed per username
app.ratelimit.login.max-attempts=5
app.ratelimit.login.window-seconds=300

# General API throttle, keyed per authenticated user (or per IP if anonymous)

app.ratelimit.api.max-requests=10
app.ratelimit.api.window-seconds=300